<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Counter</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="counter">
            <h1 style="color: rgb(32, 95, 23);">counter</h1>
            <h2 id="counter" style="color: rgb(21, 85, 21);">0</h2>
            <label>Start:</label>
            <input type="number" id="startValue" value="0"><br><br>
            <label>End:</label>
            <input type="number" id="endValue" value="1000"><br><br>
            <label>Speed (ms):</label>
            <input type="number" id="speedValue" value="5"><br><br>
            <button id="startBtn">click to start</button>
        </div>
    </div>
    <script src="./assets/js/script.js"></script>
</body>

</html
